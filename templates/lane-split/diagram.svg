    <text x="977" y="417" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8A8A8A">chat.create</text>
    <rect x="1025" y="370" width="110" height="80" rx="9" fill="#EAF2FE" stroke="#5B8DEF" stroke-width="1.4"/>
    <text x="1080" y="400" text-anchor="middle" font-weight="600" fill="#2F5FBF">Build</text>
    <text x="1080" y="417" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8A8A8A">subagent.spawn</text>
    <rect x="1135" y="370" width="95" height="80" rx="9" fill="#FDF3E3" stroke="#D9A441" stroke-width="1.4"/>
    <text x="1182" y="400" text-anchor="middle" font-weight="600" fill="#A8741A">Gate</text>
    <text x="1182" y="417" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8A8A8A">flow close</text>
