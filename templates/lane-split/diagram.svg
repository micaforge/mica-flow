    <text x="590" y="91">build</text>
    <rect x="648" y="80" width="14" height="14" rx="4" fill="#FDF3E3" stroke="#D9A441"/>
    <text x="668" y="91">gate</text>
    <circle cx="730" cy="87" r="8" fill="#FFF7E8" stroke="#D9A441"/>
    <text x="727" y="91" font-size="10" font-weight="700" fill="#B07C1F">H</text>
    <text x="744" y="91">human tap</text>
    <rect x="838" y="80" width="14" height="14" rx="4" fill="#F3F0FF" stroke="#6D5BD0"/>
    <text x="858" y="91">spec / integration</text>
