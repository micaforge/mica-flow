<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1400" height="800" fill="#FBFAF7"/>

  <!-- header -->
