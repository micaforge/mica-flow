    <rect x="325" y="260" width="110" height="80" rx="9" fill="#EAF2FE" stroke="#5B8DEF" stroke-width="1.4"/>
    <text x="380" y="290" text-anchor="middle" font-weight="600" fill="#2F5FBF">Build</text>
    <text x="380" y="307" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8A8A8A">subagent.spawn</text>
    <rect x="435" y="260" width="95" height="80" rx="9" fill="#FDF3E3" stroke="#D9A441" stroke-width="1.4"/>
    <text x="482" y="290" text-anchor="middle" font-weight="600" fill="#A8741A">Gate</text>
