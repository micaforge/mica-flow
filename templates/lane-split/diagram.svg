    <text x="977" y="290" text-anchor="middle" font-weight="600" fill="#2E7D4F">Research</text>
    <text x="977" y="307" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8A8A8A">chat.create</text>
    <rect x="1025" y="260" width="110" height="80" rx="9" fill="#EAF2FE" stroke="#5B8DEF" stroke-width="1.4"/>
    <text x="1080" y="290" text-anchor="middle" font-weight="600" fill="#2F5FBF">Build</text>
    <text x="1080" y="307" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8A8A8A">subagent.spawn</text>
